name: Organization-trusted release signing

on:
  workflow_dispatch:
  release:
    types: [published]

# Do not add contents: write or secrets here. The protected environment is the
# human approval gate; id-token is an ephemeral GitHub OIDC credential.
permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: release-signing-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sign:
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: release-signing
    steps:
      - name: Check out the selected protected ref
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"

      - name: Install the pinned local verification client
        run: python -m pip install --disable-pip-version-check "sigstore==4.5.0"

      - name: Build the wheel and source distribution
        run: |
          python -m pip install --disable-pip-version-check "build==1.5.0"
          python -m build --wheel --sdist

      - name: Require the reviewed SBOM
        shell: bash
        run: test -s SBOM.json

      - name: Create the deterministic release manifest
        shell: bash
        run: |
          python scripts/create_release_manifest.py \
            --output ARTIFACT_MANIFEST.sha256 \
            dist/*.whl dist/*.tar.gz SBOM.json

      - name: Sign four release artifacts with Fulcio and Rekor
        uses: sigstore/gh-action-sigstore-python@5b79a39c381910c090341a2c9b0bf022c8b387e1 # v3.4.0
        with:
          inputs: |
            dist/*.whl
            dist/*.tar.gz
            SBOM.json
            ARTIFACT_MANIFEST.sha256
          verify: true
          verify-cert-identity: https://github.com/${{ github.repository }}/.github/workflows/release-signing.yml@${{ github.ref }}
          verify-oidc-issuer: https://token.actions.githubusercontent.com
          rekor-version: "1"
          upload-signing-artifacts: true
          release-signing-artifacts: false

      - name: Create GitHub artifact attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
            SBOM.json
            ARTIFACT_MANIFEST.sha256

      - name: Associate the reviewed SBOM with package subjects
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
          sbom-path: SBOM.json

      - name: Verify with the exact workflow identity
        shell: bash
        run: |
          wheel="$(printf '%s\n' dist/*.whl | head -n 1)"
          sdist="$(printf '%s\n' dist/*.tar.gz | head -n 1)"
          python scripts/verify_sigstore.py \
            --repository "$GITHUB_REPOSITORY" \
            --ref "$GITHUB_REF" \
            --sha "$GITHUB_SHA" \
            --manifest ARTIFACT_MANIFEST.sha256 \
            --artifact "$wheel" \
            --artifact "$sdist" \
            --artifact SBOM.json \
            --artifact ARTIFACT_MANIFEST.sha256

      - name: Upload release files, bundles, and manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zoracleflux-release-signing-${{ github.sha }}
          if-no-files-found: error
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.sigstore.json
            SBOM.json
            SBOM.json.sigstore.json
            ARTIFACT_MANIFEST.sha256
            ARTIFACT_MANIFEST.sha256.sigstore.json
