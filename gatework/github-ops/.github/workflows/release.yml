name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release
        required: true
        type: string

permissions:
  contents: read

jobs:
  gate:
    name: release-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out tag
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --requirement requirements.lock
          python -m pip install build
      - name: Install package and test
        run: |
          python -m pip install --no-deps .
          python -m pytest -q
          zoracleflux check --json
      - name: Build distributions
        run: python -m build --sdist --wheel
      - name: Hash release files
        run: sha256sum dist/* > SHA256SUMS.txt
      - name: Upload gated files
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ inputs.tag || github.ref_name }}
          path: |
            dist/*
            SHA256SUMS.txt
          retention-days: 14

  publish:
    name: publish-release
    needs: gate
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    environment:
      name: production
    steps:
      - name: Check out tag
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Install build tool
        run: python -m pip install build
      - name: Rebuild and hash
        run: |
          python -m build --sdist --wheel
          files=(dist/*)
          if [ -f SBOM.json ]; then files+=(SBOM.json); fi
          sha256sum "${files[@]}" > SHA256SUMS.txt
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          assets=(dist/* SHA256SUMS.txt)
          if [ -f SBOM.json ]; then assets+=(SBOM.json); fi
          gh release create "$RELEASE_TAG" "${assets[@]}" \
            --verify-tag --generate-notes --title "$RELEASE_TAG"
